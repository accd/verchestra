name: Feature request
description: Propose a scoped capability with a clear delivery outcome.
title: "feat: "
labels: ["type: feature", "status: ready"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or delivery problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not an implementation prescription.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and edge cases that deterministic tests can verify.
    validations:
      required: true
  - type: textarea
    id: canonical
    attributes:
      label: Canonical repository references
      description: Identify repository-relative sources, schemas, architecture, roadmap, or existing handoff artifacts.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Policy, privacy, and operational impact
      description: Explain affected credentials, data, effects, approvals, or compatibility boundaries.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      description: Name the smallest relevant tests and required repository gates.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff and human review
      description: State whether tracked feature artifacts are required and what evidence a human reviewer must approve.
    validations:
      required: true
