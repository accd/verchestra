name: Bug report
description: Report a reproducible defect without sensitive information.
title: "bug: "
labels: ["type: maintenance", "status: ready"]
body:
  - type: markdown
    attributes:
      value: "Thank you. Do not include credentials, production data, private schemas, or private URLs."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide safe, deterministic steps.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and edge cases
      description: What exact behavior proves the defect is fixed without weakening existing assertions?
    validations:
      required: true
  - type: textarea
    id: canonical
    attributes:
      label: Canonical repository references
      description: Identify the relevant repository-relative source, schema, architecture, roadmap, or handoff.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      description: Name safe reproduction tests and the required repository gates.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff and human review
      description: State whether tracked handoff artifacts are needed and what evidence a human reviewer must approve.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verchestra revision or version
      placeholder: "commit SHA or 0.0.0-qualification"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, production data, private schema details, and machine-local paths.
          required: true
        - label: I assessed the safety impact and did not request gate weakening or destructive commands.
          required: true
