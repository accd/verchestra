name: Platform qualification matrix

# T75 acceptance criterion 4 — "Every supported platform passes the
# release-candidate security gate" — has to run somewhere real, and the single
# ubuntu-latest job in ci.yml and full-validation.yml can never prove it. This
# workflow runs the selected closed gate profile across the exact supported
# fleet from issue #16 (Windows x64, macOS x64 and arm64, Linux glibc x64 and
# arm64) and uploads one evidence file per leg binding platform, architecture,
# runtime, candidate revision, and its own digest (acceptance criterion 3).
#
# It is workflow_dispatch only, never push or pull_request: the fleet is the
# owner's on-demand release-candidate check, not a per-commit tax. Standard
# GitHub-hosted runners — including macOS and ubuntu-*-arm — are free minutes on
# this public repository, so the fleet costs no billed time.
#
# This does NOT close T75. It delivers the platform x security-gate leg with
# per-platform evidence; the topology, Driver, database (SAP ASE / Sybase),
# sandbox, installer, and recovery matrices, and the signed evidence index,
# remain open work under issue #16.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact 40-character commit SHA to validate (empty selects this workflow revision)"
        required: false
        default: ""
        type: string
      gate:
        description: "Closed qualification profile to run on every platform"
        required: true
        default: "security"
        type: choice
        options:
          - quick
          - full
          - build
          - security
          - release

permissions:
  contents: read

# Every leg runs the same bash entry points (set -euo pipefail, heredocs, case
# guards) that full-validation.yml proved on Linux. Forcing bash on Windows uses
# the runner's bundled Git bash so one script serves all five platforms.
defaults:
  run:
    shell: bash

jobs:
  platform:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # gate:release and gate:security are the heaviest selectable profiles, and
    # macOS and arm64 legs are slower than the ubuntu baseline, so the budget
    # reflects those rather than gate:quick.
    timeout-minutes: 60
    strategy:
      # One platform gap is exactly the signal this workflow exists to surface,
      # so a failing leg must never cancel the others.
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
          - label: macOS x64
            os: macos-15-intel
            platform: darwin
            arch: x64
          - label: macOS arm64
            os: macos-14
            platform: darwin
            arch: arm64
          - label: Linux glibc x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - label: Linux glibc arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve exact candidate revision
        id: candidate
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_GATE: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          revision="${REQUESTED_REVISION:-$GITHUB_SHA}"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be an empty value or a full lowercase 40-character Git SHA" >&2
            exit 1
          fi
          case "$REQUESTED_GATE" in
            quick|full|build|security|release) ;;
            *) echo "gate must be one of quick, full, build, security, release" >&2; exit 1 ;;
          esac
          # Full history, never --depth=1: a shallow fetch marks the candidate as
          # a graft boundary, and every qualification report after T68 has to
          # prove `git merge-base --is-ancestor <reported revision> HEAD`. Under a
          # shallow checkout that proof fails for reports that are perfectly
          # valid, so the resolver silently reports an older task.
          git fetch --no-tags origin "$revision"
          git checkout --detach "$revision"
          if [[ "$(git rev-parse HEAD)" != "$revision" ]]; then
            echo "checked out revision does not match the requested candidate" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "gate=gate:$REQUESTED_GATE" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record platform candidate identity
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          CANDIDATE_GATE: ${{ steps.candidate.outputs.gate }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";

          const revision = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (revision !== process.env.CANDIDATE_REVISION) throw new Error("candidate revision verification failed");
          // The matrix labels claim an architecture; the runner has to actually
          // be it or the evidence lies. Refuse a mismatch rather than record it.
          if (process.platform !== process.env.MATRIX_PLATFORM)
            throw new Error(`runner platform ${process.platform} does not match matrix ${process.env.MATRIX_PLATFORM}`);
          if (process.arch !== process.env.MATRIX_ARCH)
            throw new Error(`runner arch ${process.arch} does not match matrix ${process.env.MATRIX_ARCH}`);

          const identity = {
            revision,
            ref: process.env.GITHUB_REF ?? "",
            gate: process.env.CANDIDATE_GATE,
            platform: process.platform,
            arch: process.arch,
            runtime: process.version,
            runner: process.env.RUNNER_OS ?? ""
          };
          // The digest is written into the file, not just logged. A digest that
          // exists only in a job log expires with the log and can bind nothing;
          // acceptance criterion 3 requires the report to bind evidence digests,
          // so the evidence has to carry its own. It covers `identity` rather
          // than the whole file, because a file cannot contain its own digest.
          const identityDigest = `sha256:${createHash("sha256").update(JSON.stringify(identity)).digest("hex")}`;
          const record = { schemaVersion: 2, identity, identityDigest };
          await writeFile("platform-validation.json", `${JSON.stringify(record, null, 2)}\n`);
          console.log(`platform identity digest ${identityDigest}`);
          NODE
      # gate:build, gate:security, and gate:release all run test:qualification,
      # which probes the installed Claude Code and Codex binaries. Without them
      # those profiles fail on a clean runner while passing on a machine that
      # happens to have the CLIs, which is the opposite of portable evidence. The
      # need is derived from the candidate revision's own gate definition so this
      # cannot drift from the profile list.
      - name: Decide whether the selected gate needs the driver probes
        id: probes
        env:
          CANDIDATE_GATE: ${{ steps.candidate.outputs.gate }}
        run: |
          set -euo pipefail
          needed="$(node --input-type=module --eval "
            import { GATE_STAGES } from './scripts/gate-stages.mjs';
            const stages = GATE_STAGES[process.env.CANDIDATE_GATE];
            if (stages === undefined) throw new Error('unknown gate profile');
            process.stdout.write(stages.includes('test:qualification') ? 'yes' : 'no');
          ")"
          printf 'needed=%s\n' "$needed" >> "$GITHUB_OUTPUT"
      - name: Install the qualified local driver probes
        if: steps.probes.outputs.needed == 'yes'
        run: |
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.168 @openai/codex@0.115.0
          claude_version="$(claude --version)"
          codex_version="$(codex --version)"
          printf 'Claude Code version: %s\n' "$claude_version"
          printf 'Codex version: %s\n' "$codex_version"
          case "$claude_version" in "2.1.168"|"2.1.168 "*) ;; *) exit 1 ;; esac
          case "$codex_version" in "codex-cli 0.115.0"|"codex-cli 0.115.0 "*) ;; *) exit 1 ;; esac
      - name: Run selected qualification gate
        id: gate
        env:
          CANDIDATE_GATE: ${{ steps.candidate.outputs.gate }}
          # Exact-pin enforcement for the fleet's driver qualification (#18, F4).
          VES_REQUIRE_PINNED_PROVIDERS: "1"
        run: pnpm "$CANDIDATE_GATE"
      # A leg that passed and a leg that failed are both evidence. Recording only
      # the successful ones would let the index report a green fleet by omission,
      # which is the exact failure mode the matrix exists to prevent.
      - name: Record the leg outcome
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { existsSync } from "node:fs";
          import { createHash } from "node:crypto";

          // The identity step can fail before writing (an arch mismatch refuses
          // rather than records). Nothing to annotate then; the missing artifact
          // is itself the signal the index reports.
          if (!existsSync("platform-validation.json")) {
            console.log("no identity record to annotate");
            process.exit(0);
          }
          const record = JSON.parse(await readFile("platform-validation.json", "utf8"));
          const outcome = { result: process.env.GATE_OUTCOME === "success" ? "pass" : "fail", reported: process.env.GATE_OUTCOME };
          const sealed = { ...record, outcome };
          const legDigest = `sha256:${createHash("sha256").update(JSON.stringify(sealed)).digest("hex")}`;
          await writeFile("platform-validation.json", `${JSON.stringify({ ...sealed, legDigest }, null, 2)}\n`);
          console.log(`leg outcome ${outcome.result}; leg digest ${legDigest}`);
          NODE
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-evidence-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: platform-validation.json
          retention-days: 14

  # Every leg used to upload its evidence into a 14-day artifact that nothing
  # ever downloaded, so the fleet produced no collected record and the T75 report
  # had nothing to bind. This job is that collection: it enumerates the expected
  # fleet, verifies each leg's own digests, and states the status of every leg —
  # including the ones that never reported.
  #
  # OPERATIONAL NOTE — a leg that never dequeues blocks this job, not the
  # evidence. `needs:` waits for every matrix leg to *finish*, and GitHub has no
  # per-job queue timeout, so while an Intel runner sits
  # queued this job cannot start. Cancel the run: `if: always()` still fires this
  # job, and the index then records that leg as `missing` rather than omitting
  # it. Verified in production on runs 31327128912/34227/40097/46281 — each
  # published a complete index with `darwin-x64: missing` and `complete: false`.
  # The run's own conclusion reads `cancelled`; the index, not the run badge, is
  # the evidence.
  index:
    name: Evidence index
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect every leg's evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: evidence
          pattern: platform-evidence-*-${{ github.run_id }}
      - name: Build the evidence index
        env:
          # Pinned to the matrix legs above and held equal to them by
          # tests/agent-readiness/platform-matrix-workflow.test.mjs, so a leg can
          # never be added to the fleet without the index expecting it.
          EXPECTED_LEGS: win32-x64,darwin-x64,darwin-arm64,linux-x64,linux-arm64
          REQUESTED_GATE: ${{ inputs.gate }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from "node:fs/promises";
          import { existsSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";

          const expected = process.env.EXPECTED_LEGS.split(",");
          const collected = new Map();
          if (existsSync("evidence")) {
            for (const entry of await readdir("evidence", { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const file = join("evidence", entry.name, "platform-validation.json");
              if (!existsSync(file)) continue;
              const record = JSON.parse(await readFile(file, "utf8"));
              collected.set(`${record.identity.platform}-${record.identity.arch}`, record);
            }
          }

          const legs = expected.map((leg) => {
            const record = collected.get(leg);
            // A leg that never reported is not a pass and not a failure: it did
            // not run. Saying so is the point.
            if (record === undefined) return { leg, status: "missing" };
            // Recompute both digests rather than trusting the values shipped in
            // the artifact; an artifact that disagrees with itself is reported,
            // never silently accepted.
            const identityDigest = `sha256:${createHash("sha256").update(JSON.stringify(record.identity)).digest("hex")}`;
            const { legDigest, ...unsealed } = record;
            const recomputed = `sha256:${createHash("sha256").update(JSON.stringify(unsealed)).digest("hex")}`;
            if (identityDigest !== record.identityDigest || recomputed !== legDigest)
              return { leg, status: "digest-mismatch", identity: record.identity };
            return {
              leg,
              status: record.outcome?.result === "pass" ? "qualified" : "failed",
              identity: record.identity,
              identityDigest,
              legDigest
            };
          });

          const revisions = new Set(legs.filter((leg) => leg.identity).map((leg) => leg.identity.revision));
          const index = {
            schemaVersion: 1,
            runId: process.env.RUN_ID,
            gate: `gate:${process.env.REQUESTED_GATE}`,
            // One run must qualify exactly one candidate; more than one revision
            // means the legs are not evidence about the same thing.
            revision: revisions.size === 1 ? [...revisions][0] : null,
            complete: legs.every((leg) => leg.status === "qualified"),
            legs
          };
          const body = `${JSON.stringify(index, null, 2)}\n`;
          await writeFile("platform-evidence-index.json", body);
          console.log(body);
          if (revisions.size > 1) throw new Error("legs report more than one candidate revision");
          NODE
      - name: Upload the evidence index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-evidence-index-${{ github.run_id }}
          path: platform-evidence-index.json
          retention-days: 90
