name: SonarCloud

# CI-based SonarCloud analysis. It replaces Automatic Analysis, which cannot
# import coverage: the test scopes below write LCOV for the product sources and
# the scanner uploads it with the analysis configured in sonar-project.properties.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    env:
      VES_COVERAGE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          # New-code detection and blame need the full history.
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Measure coverage
        # The in-process scopes of gate:full. End-to-end and mutation scopes run
        # the product in child processes, which in-process coverage cannot see.
        run: |
          set -euo pipefail
          for stage in test:unit test:contract test:integration test:fault; do
            echo "::group::pnpm run $stage"
            pnpm run "$stage"
            echo "::endgroup::"
          done
          node scripts/merge-coverage.mjs
      - name: Check the analysis token
        # A pull request from a fork receives no secrets, so it cannot analyze;
        # skipping keeps its other checks meaningful instead of failing here.
        # The token is scoped to this step and the scan, never to the test steps
        # that execute the change under review.
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - name: Analyze
        if: steps.token.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
