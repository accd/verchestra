name: SonarCloud

# CI-based SonarCloud analysis. It replaces Automatic Analysis, which cannot
# import coverage: the test scopes below write LCOV for the product sources and
# the scanner uploads it with the analysis configured in sonar-project.properties.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    permissions:
      contents: read
      pull-requests: read
    env:
      VES_COVERAGE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          # New-code detection and blame need the full history.
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Measure coverage (diagnostic)
        run: |
          set +e
          cat > /tmp/orphan-probe.mjs <<'JS'
          import { appendFileSync } from "node:fs";
          const startPpid = process.ppid;
          const started = Date.now();
          process.on("exit", (code) => {
            let parentAlive = true;
            try { process.kill(startPpid, 0); } catch { parentAlive = false; }
            if (process.ppid !== startPpid || !parentAlive)
              appendFileSync("/tmp/orphans.log", JSON.stringify({ pid: process.pid, startPpid, ppid: process.ppid, code, ms: Date.now() - started, argv: process.argv.slice(1).map((a) => a.slice(0, 160)), cwd: process.cwd() }) + "\n");
          });
          JS
          export NODE_OPTIONS="--import=/tmp/orphan-probe.mjs"
          for stage in test:unit test:contract test:security; do
            rm -rf /tmp/v8cov; mkdir -p /tmp/v8cov
            echo "::group::pnpm run $stage"
            NODE_V8_COVERAGE=/tmp/v8cov pnpm run "$stage" > /tmp/$stage.log 2>&1; echo "exit=$?"
            grep -n "Could not report\|^ℹ fail\|^ℹ tests" /tmp/$stage.log || true
            echo "::endgroup::"
            echo "== $stage invalid coverage files"
            node -e '
              const fs=require("fs"),p=require("path");
              for (const n of fs.readdirSync("/tmp/v8cov")) {
                const t=fs.readFileSync(p.join("/tmp/v8cov",n),"utf8");
                try { JSON.parse(t); } catch { const urls=[...t.matchAll(/"url":"(file:[^"]+)"/g)].map(m=>m[1]).filter(u=>!u.includes("node_modules")).slice(0,6); console.log(n, t.length, urls); }
              }'
            echo "== $stage orphans"; cat /tmp/orphans.log 2>/dev/null || echo none; rm -f /tmp/orphans.log
          done
          exit 0
