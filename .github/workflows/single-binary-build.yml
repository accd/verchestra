name: Single-binary build (#236)

# why: this builds the `vestra` single executable on every supported target,
# natively, and keeps the bytes as workflow artifacts. It is the only place the four
# targets the owner's workstation cannot execute (darwin-x64 natively, both
# Linux targets, and win32-x64) are proven to start from their embedded runtime.
#
# It deliberately does NOT publish, sign with an identity, or notarize.
# Nothing is uploaded anywhere but this run's artifacts, no credential or
# signing secret is read, and no OIDC identity is requested. Developer ID
# signing and notarization (macOS) and Authenticode signing (Windows) remain
# owner actions on the emitted bytes; see
# docs/qualification/single-binary-distribution.md.
#
# Two modes share one job:
#  - Always: the pinned official Node archive for the leg is fetched from
#    nodejs.org and checked against the digest tracked in
#    apps/vestra-launcher/single-binary/node-runtime.json, then the focused
#    single-binary suites run against it with zero skips allowed. That proves
#    injection, determinism, a PATH-less `--version`, and a PATH-less run that
#    reaches the TUF activation path, on the leg's own operating system.
#  - When release_inputs_run_id and release_inputs_revision name a
#    t76-publish-release run: its reviewed pinned inputs are downloaded, the
#    binary is built twice from them, the two trees are compared byte for
#    byte, and the result is uploaded with its manifest and license closure.
#
# Every dispatch input is untrusted: none is interpolated into a `run:` block;
# each crosses into the shell only as an `env:` value and is validated against
# an exact pattern before use.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact 40-character SHA to build the binary from"
        required: true
        type: string
      release_inputs_revision:
        description: "Candidate SHA of the t76-publish-release run holding reviewed pinned inputs (empty: tests only)"
        required: false
        default: ""
        type: string
      release_inputs_run_id:
        description: "t76-publish-release run id holding reviewed pinned inputs (empty: tests only)"
        required: false
        default: ""
        type: string

# invariant: read-only. `actions: read` lets download-artifact reach the publication run's
# pinned inputs by run id; it grants no write of any kind.
permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  target:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
          - label: macOS x64
            os: macos-15-intel
            platform: darwin
            arch: x64
          - label: macOS arm64
            os: macos-14
            platform: darwin
            arch: arm64
          - label: Linux glibc x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - label: Linux glibc arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Verify revision, target, runtime, and every dispatch input
        env:
          BUILD_REVISION: ${{ inputs.revision }}
          INPUTS_REVISION: ${{ inputs.release_inputs_revision }}
          INPUTS_RUN_ID: ${{ inputs.release_inputs_run_id }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$BUILD_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "revision must be a full lowercase 40-character SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$BUILD_REVISION" ]] || {
            echo "checkout is not at the requested exact revision" >&2
            exit 1
          }
          if [[ -n "$INPUTS_REVISION$INPUTS_RUN_ID" ]]; then
            [[ "$INPUTS_REVISION" =~ ^[0-9a-f]{40}$ && "$INPUTS_RUN_ID" =~ ^[0-9]{1,20}$ ]] || {
              echo "release_inputs_revision and release_inputs_run_id must be given together and exactly" >&2
              exit 1
            }
          fi
          [[ "$(node --version)" == "v24.14.0" ]] || {
            echo "the qualified Node runtime must be installed before this step" >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          if (process.platform !== process.env.MATRIX_PLATFORM)
            throw new Error(`runner platform ${process.platform} does not match ${process.env.MATRIX_PLATFORM}`);
          if (process.arch !== process.env.MATRIX_ARCH)
            throw new Error(`runner arch ${process.arch} does not match ${process.env.MATRIX_ARCH}`);
          NODE

      - name: Install dependencies
        run: |
          set -euo pipefail
          # why: lifecycle scripts stay off; esbuild is the one binary this workflow
          # executes, so it alone is rebuilt, and then proven to run.
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
          node -e "require('esbuild').buildSync({stdin:{contents:''},write:false})"

      - name: Fetch the pinned official Node archive and check its digest
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { mkdir, readFile, writeFile } from "node:fs/promises";

          const pins = JSON.parse(await readFile("apps/vestra-launcher/single-binary/node-runtime.json", "utf8"));
          const pin = pins.targets[`${process.env.MATRIX_PLATFORM}-${process.env.MATRIX_ARCH}`].archive;
          const response = await fetch(new URL(pin.fileName, pins.distributionBaseUrl));
          if (response.status !== 200) throw new Error(`nodejs.org answered ${response.status} for ${pin.fileName}`);
          const bytes = Buffer.from(await response.arrayBuffer());
          const digest = createHash("sha256").update(bytes).digest("hex");
          if (digest !== pin.sha256) throw new Error(`${pin.fileName} does not match its pinned SHA-256`);
          await mkdir("node-dist-cache", { recursive: true });
          await writeFile(`node-dist-cache/${pin.fileName}`, bytes);
          NODE

      - name: Run the single-binary suites with zero skips allowed
        env:
          VES_NODE_DIST_CACHE: node-dist-cache
        run: |
          set -euo pipefail
          node --test \
            tests/unit/sea-inject.test.mjs \
            tests/unit/node-runtime-archive.test.mjs \
            tests/unit/vestra-single-binary-bootstrap.test.mjs \
            tests/build/vestra-binary.test.mjs 2>&1 | tee single-binary-tests.log
          grep -Eq '^ℹ fail 0$' single-binary-tests.log
          grep -Eq '^ℹ skipped 0$' single-binary-tests.log || {
            echo "a single-binary case was skipped on its own target; that is not evidence" >&2
            exit 1
          }

      - name: Download the reviewed pinned release inputs
        if: inputs.release_inputs_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_inputs_run_id }}
          name: t76-release-metadata-${{ inputs.release_inputs_revision }}-${{ inputs.release_inputs_run_id }}
          path: reviewed

      - name: Build twice from the reviewed inputs and compare every byte
        if: inputs.release_inputs_run_id != ''
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          target="$MATRIX_PLATFORM-$MATRIX_ARCH"
          for out in vestra-binary vestra-binary-replay; do
            pnpm build:vestra-binary -- \
              --target "$target" \
              --node-cache node-dist-cache \
              --release-inputs reviewed/t76-release-publication/release-inputs \
              --out "$out"
          done
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { spawnSync } from "node:child_process";
          import { readFile, readdir } from "node:fs/promises";
          import { join, relative } from "node:path";

          const tree = async (root) => {
            const files = [];
            for (const entry of await readdir(root, { withFileTypes: true, recursive: true })) {
              if (!entry.isFile()) continue;
              const path = join(entry.parentPath, entry.name);
              const digest = createHash("sha256").update(await readFile(path)).digest("hex");
              files.push(`${relative(root, path).replaceAll("\\", "/")} ${digest}`);
            }
            return files.sort().join("\n");
          };
          if ((await tree("vestra-binary")) !== (await tree("vestra-binary-replay")))
            throw new Error("two builds from identical inputs emitted different bytes");
          const manifest = JSON.parse(await readFile("vestra-binary/vestra-binary-manifest.json", "utf8"));
          const env = { PATH: "", HOME: process.env.RUNNER_TEMP, USERPROFILE: process.env.RUNNER_TEMP };
          if (process.platform === "win32") env.SystemRoot = process.env.SystemRoot;
          const run = spawnSync(join("vestra-binary", manifest.executable.path), ["--version"], { env, encoding: "utf8" });
          if (run.status !== 0 || !run.stdout.startsWith(`vestra ${manifest.release.semanticVersion} (single binary; `))
            throw new Error(`the reviewed binary did not answer --version with PATH emptied: ${run.stderr}`);
          process.stdout.write(run.stdout);
          NODE

      - name: Upload the binary, its manifest, and the suite transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vestra-binary-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            single-binary-tests.log
            vestra-binary
          if-no-files-found: warn
          retention-days: 30

  collect:
    name: Collect five target binaries
    needs: target
    if: always() && inputs.release_inputs_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download every target artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vestra-binary-*-${{ github.run_id }}
          path: targets
          merge-multiple: false

      - name: Reconcile exactly one binary per supported target
        env:
          BUILD_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const expected = new Set(["win32-x64", "darwin-x64", "darwin-arm64", "linux-x64", "linux-arm64"]);
          const entries = [];
          for (const directory of await readdir("targets", { withFileTypes: true })) {
            if (!directory.isDirectory()) continue;
            const path = join("targets", directory.name, "vestra-binary", "vestra-binary-manifest.json");
            const bytes = await readFile(path).catch((error) => (error?.code === "ENOENT" ? undefined : Promise.reject(error)));
            if (bytes === undefined) continue;
            const manifest = JSON.parse(bytes.toString("utf8"));
            entries.push({
              target: `${manifest.target.platform}-${manifest.target.arch}`,
              executable: manifest.executable,
              manifestDigest: `sha256:${createHash("sha256").update(bytes).digest("hex")}`
            });
          }
          const keys = entries.map((entry) => entry.target);
          if (entries.length !== expected.size || new Set(keys).size !== expected.size || !keys.every((key) => expected.has(key)))
            throw new Error("the run does not hold exactly one reviewed binary for every supported target");
          entries.sort((left, right) => (left.target < right.target ? -1 : 1));
          const index = { schemaVersion: 1, revision: process.env.BUILD_REVISION, targets: entries };
          await writeFile("single-binary-index.json", `${JSON.stringify(index, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Upload the reconciled index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: single-binary-index-${{ inputs.revision }}-${{ github.run_id }}
          path: single-binary-index.json
          retention-days: 90
