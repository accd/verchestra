name: OS credential store qualification

# Issue #379: `vestra secret` stores a readable provider credential in the
# operating system's own credential store. Each platform's backend is proven
# against its real store by the standalone `pnpm qualify:keychain` suite
# (spikes/os-secret-store), which no gate runs, because a gate must never touch
# a user's keychain, keyring, or Credential Manager. This workflow is where that
# suite runs on all three platforms:
#
# - Linux: the Secret Service through `secret-tool`, inside a disposable D-Bus
#   session and gnome-keyring daemon the suite starts itself, with a temporary
#   HOME. It never reaches a real user keyring.
# - Windows: Credential Manager through Windows PowerShell and advapi32, using
#   a random target prefix that every case deletes in `finally`.
# - macOS: a disposable keychain file created, unlocked, and deleted by the
#   suite. It never reads or writes the login keychain.
#
# Each platform asserts that its own store works and that the other platforms'
# stores are refused honestly. Nothing is skipped. The job holds read-only
# repository access and reads no secret.

on:
  workflow_dispatch:
  # TEMPORARY: registers this workflow so it can be dispatched on its branch
  # before it exists on the default branch. Removed before review.
  push:
    branches: [feat/379-linux-windows-credential-stores]
  pull_request:
    paths:
      - ".github/workflows/os-credential-store.yml"
      - "apps/vestra-cli/src/secret-composition.ts"
      - "docs/qualification/os-secret-backend-*.md"
      - "packages/platform-node/src/os-secret-backends/**"
      - "packages/platform-node/src/secret-broker.ts"
      - "spikes/os-secret-store/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  credential-store:
    name: credential-store (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # why: one platform's store failing is exactly the signal this job
      # exists to surface; it must not cancel the other two.
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            platform: linux
          - label: Windows
            os: windows-latest
            platform: win32
          - label: macOS
            os: macos-latest
            platform: darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install the Secret Service tools
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsecret-tools gnome-keyring dbus-x11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Confirm the runner is the platform the leg claims
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          node --eval '
            if (process.platform !== process.env.MATRIX_PLATFORM)
              throw new Error(`runner platform ${process.platform} does not match ${process.env.MATRIX_PLATFORM}`);
            console.log(`platform ${process.platform} ${process.arch}, node ${process.version}`);
          '
      - name: TEMPORARY Windows PowerShell diagnostics
        if: matrix.platform == 'win32'
        run: node spikes/os-secret-store/diagnostics/windows-powershell.mjs
      - name: Qualify the platform credential store
        run: pnpm qualify:keychain
