name: Sign T75 qualification evidence

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact 40-character candidate SHA"
        required: true
        type: string
      quick_run_id:
        description: "Platform-matrix run id for gate:quick"
        required: true
        type: string
      full_run_id:
        description: "Platform-matrix run id for gate:full"
        required: true
        type: string
      build_run_id:
        description: "Platform-matrix run id for gate:build"
        required: true
        type: string
      security_run_id:
        description: "Platform-matrix run id for gate:security"
        required: true
        type: string
      release_run_id:
        description: "Platform-matrix run id for gate:release"
        required: true
        type: string
      public_key_ref_path:
        description: "Committed public PublicKeyRef below docs/qualification/trust"
        required: true
        default: "docs/qualification/trust/t75-evidence-public-key.json"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  attest:
    name: Regenerate and attest T75 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - name: Verify the exact candidate revision
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          case "$CANDIDATE_REVISION" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "candidate revision must be a 40-character lowercase SHA" >&2; exit 1 ;;
          esac
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_REVISION" || {
            echo "checked-out revision does not resolve to the requested exact revision" >&2
            exit 1
          }
      - name: Download gate quick evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.quick_run_id }}
          name: platform-evidence-index-${{ inputs.quick_run_id }}
          path: evidence/quick
      - name: Download gate full evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.full_run_id }}
          name: platform-evidence-index-${{ inputs.full_run_id }}
          path: evidence/full
      - name: Download gate build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: platform-evidence-index-${{ inputs.build_run_id }}
          path: evidence/build
      - name: Download gate security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.security_run_id }}
          name: platform-evidence-index-${{ inputs.security_run_id }}
          path: evidence/security
      - name: Download gate release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: platform-evidence-index-${{ inputs.release_run_id }}
          path: evidence/release
      - name: Regenerate the canonical evidence index
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          mapfile -t fleet_indexes < <(find evidence -type f -name platform-evidence-index.json | sort)
          test "${#fleet_indexes[@]}" -eq 5 || {
            echo "expected exactly five fleet profile indexes" >&2
            exit 1
          }
          node scripts/t75-evidence-index.mjs --revision "$CANDIDATE_REVISION" --out unsigned-evidence-index.json "${fleet_indexes[@]}"
      - name: Refuse to sign contradictory qualification evidence
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const index = JSON.parse(await readFile("unsigned-evidence-index.json", "utf8"));
          if (index.revision !== process.env.CANDIDATE_REVISION)
            throw new Error("regenerated evidence index does not bind the requested candidate");
          if (index.signingState?.signed !== false)
            throw new Error("the signing workflow must start from an explicitly unsigned index");
          if (index.summary?.contradictions !== 0)
            throw new Error(`refusing to sign ${index.summary?.contradictions ?? "unknown"} evidence contradiction(s)`);
          const profiles = index.profiles ?? [];
          const expected = new Set(["gate:quick", "gate:full", "gate:build", "gate:security", "gate:release"]);
          const observed = new Set(profiles.map(({ gate }) => gate));
          if (profiles.length !== expected.size || observed.size !== expected.size || [...expected].some((gate) => !observed.has(gate)))
            throw new Error("the regenerated index must contain exactly one profile for each T75 gate");
          NODE
      - name: Sign and self-verify public qualification evidence
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
          PUBLIC_KEY_REF_PATH: ${{ inputs.public_key_ref_path }}
          VESTRA_T75_EVIDENCE_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.VESTRA_T75_EVIDENCE_SIGNING_KEY_PKCS8_BASE64 }}
        run: |
          case "$PUBLIC_KEY_REF_PATH" in
            docs/qualification/trust/*.json) ;;
            *) echo "public key reference must be a committed qualification trust file" >&2; exit 1 ;;
          esac
          test -f "$PUBLIC_KEY_REF_PATH" || {
            echo "committed public key reference is missing" >&2
            exit 1
          }
          issued_at="$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)"
          node scripts/t75-evidence-attestation.mjs sign --index unsigned-evidence-index.json --public-key-ref "$PUBLIC_KEY_REF_PATH" --revision "$CANDIDATE_REVISION" --issued-at "$issued_at" --out qualification-evidence-index.dsse.json --signed-index-out signed-evidence-index.json
          node scripts/t75-evidence-attestation.mjs verify --index signed-evidence-index.json --public-key-ref "$PUBLIC_KEY_REF_PATH" --revision "$CANDIDATE_REVISION" --envelope qualification-evidence-index.dsse.json
      - name: Publish public qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-evidence-${{ inputs.revision }}
          path: |
            signed-evidence-index.json
            qualification-evidence-index.dsse.json
            ${{ inputs.public_key_ref_path }}
            docs/qualification-evidence-attestation.md
          retention-days: 365
