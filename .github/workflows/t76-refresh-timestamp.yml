name: T76 re-sign the online timestamp and snapshot

# why: the monthly online re-signing routine (#382).  A short timestamp/snapshot
# window is the freeze-attack defense (#18 F2); this workflow is what keeps it
# from expiring.  It reads the metadata artifact an exact t76-publish-release
# run emitted, verifies the published root, targets, and components under the
# committed trust anchors without re-signing any of them, and signs only a new
# timestamp.json and <version>.snapshot.json per target with the online key.
#
# invariant: it deliberately does NOT publish.  No object is uploaded to the release
# endpoint, no storage credential exists here, and the ledger is not edited:
# uploading the new files (snapshot before timestamp) and appending the emitted
# ledger entry in a reviewed pull request stay human steps.  Everything the run
# produces leaves as one workflow artifact.
#
# invariant: only the ONLINE key is available here: VESTRA_RELEASE_TIMESTAMP_SIGNING_KEY_PKCS8_BASE64,
# read in exactly one step, only through `env:`, bound to the committed
# docs/qualification/trust/release-timestamp-snapshot-public-key.json anchor.
# The offline root/targets key is never read, and the refresh script refuses
# to run if it is present, so this routine can neither swap the release nor
# rewrite the root.
#
# hazard: every dispatch input is untrusted.  No input is interpolated into a `run:`
# block; each one crosses into the shell only as an `env:` value, is validated
# against an exact pattern before it is used, and is passed to the script as a
# quoted argument.
#
# why: the publication ledger that bounds metadata_version is read from origin/main's
# tip, not from the dispatched revision, and the dispatched revision's own copy
# must be an unedited prefix of it (#387, #382).

on:
  workflow_dispatch:
    inputs:
      publish_revision:
        description: "Exact 40-character candidate SHA the publish run signed"
        required: true
        type: string
      publish_run_id:
        description: "t76-publish-release run id whose metadata artifact holds the published root and targets"
        required: true
        type: string
      metadata_version:
        # why: must STRICTLY exceed every version the ledger records for the root. No
        # default: the operator states it consciously each time (#387).
        description: "New timestamp and snapshot version (must strictly exceed every recorded version for this root)"
        required: true
        type: string
      timestamp_expires:
        description: "New timestamp/snapshot expiry, no later than the published targets (YYYY-MM-DDTHH:mm:ss.sssZ)"
        required: true
        type: string

# invariant: read-only. `actions: read` is what lets download-artifact reach the publish
# run's metadata artifact by run id; it grants no write of any kind. No scope
# is granted write and no OIDC identity is requested, so nothing here can
# upload an object, move a tag, or publish a package.
permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  refresh:
    name: Re-sign the online timestamp and snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Verify runtime and every dispatch input
        env:
          PUBLISH_REVISION: ${{ inputs.publish_revision }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          METADATA_VERSION: ${{ inputs.metadata_version }}
          TIMESTAMP_EXPIRES: ${{ inputs.timestamp_expires }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "publish_revision must be a full lowercase 40-character SHA" >&2
            exit 1
          }
          [[ "$PUBLISH_RUN_ID" =~ ^[0-9]{1,20}$ ]] || {
            echo "publish_run_id must be a run id" >&2
            exit 1
          }
          [[ "$METADATA_VERSION" =~ ^[1-9][0-9]{0,8}$ ]] || {
            echo "metadata_version must be a positive integer" >&2
            exit 1
          }
          [[ "$TIMESTAMP_EXPIRES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]] || {
            echo "timestamp_expires must be a UTC instant with milliseconds" >&2
            exit 1
          }
          [[ "$(node --version)" == "v24.14.0" ]] || {
            echo "the qualified Node runtime must be installed before this step" >&2
            exit 1
          }

      - name: Install dependencies
        run: |
          set -euo pipefail
          # why: lifecycle scripts stay off: nothing this workflow runs needs a
          # rebuilt native or downloaded binary.
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Read the publication ledger from main's tip
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          mkdir -p main-ledger
          git show origin/main:docs/qualification/tuf-publication-ledger.json > main-ledger/tuf-publication-ledger.json
          node scripts/tuf-publication-ledger.mjs assert-prefix \
            docs/qualification/tuf-publication-ledger.json \
            main-ledger/tuf-publication-ledger.json

      - name: Download the published metadata the refresh re-signs over
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publish_run_id }}
          name: t76-release-metadata-${{ inputs.publish_revision }}-${{ inputs.publish_run_id }}
          path: current

      - name: Re-sign timestamp and snapshot for every supported target
        env:
          METADATA_VERSION: ${{ inputs.metadata_version }}
          TIMESTAMP_EXPIRES: ${{ inputs.timestamp_expires }}
          VESTRA_RELEASE_TIMESTAMP_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.VESTRA_RELEASE_TIMESTAMP_SIGNING_KEY_PKCS8_BASE64 }}
        run: >-
          node scripts/t76-refresh-timestamp.mjs
          --current current
          --out t76-timestamp-refresh
          --metadata-version "$METADATA_VERSION"
          --timestamp-expires "$TIMESTAMP_EXPIRES"
          --ledger main-ledger/tuf-publication-ledger.json
          --run-id "$GITHUB_RUN_ID"

      - name: Summarize what a human must upload and record
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";

          const manifest = JSON.parse(await readFile("t76-timestamp-refresh/refresh-manifest.json", "utf8"));
          const lines = [
            "## T76 timestamp/snapshot refresh (nothing was published)",
            "",
            `releaseId: \`${manifest.releaseId}\``,
            `baseUrl: \`${manifest.baseUrl}\``,
            `rootDigest: \`${manifest.rootDigest}\``,
            `targetsVersion: \`${manifest.targetsVersion}\` (unchanged)`,
            `metadataVersion: \`${manifest.metadataVersion}\``,
            `timestampExpires: \`${manifest.timestampExpires}\``,
            `timestampSigningKeyId: \`${manifest.timestampSigningKeyId}\``,
            "",
            "### Manual steps",
            ...manifest.steps.map((step, index) => `${index + 1}. ${step}`),
            "",
            "### Per-target objects, in upload order",
            "",
            "| target | object | sha256 |",
            "| --- | --- | --- |",
            ...manifest.targets.flatMap((target) =>
              target.assets.map((asset) => `| ${target.targetKey} | \`${asset.remoteKey}\` | \`${asset.contentDigest}\` |`)
            ),
            ""
          ];
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE

      - name: Upload the re-signed metadata, the upload manifest, and the ledger entry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t76-timestamp-refresh-${{ inputs.publish_revision }}-${{ github.run_id }}
          path: |
            t76-timestamp-refresh/refresh-manifest.json
            t76-timestamp-refresh/ledger-entry.json
            t76-timestamp-refresh/publication/*/metadata
          if-no-files-found: error
          retention-days: 365
