name: Manual qualification validation

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact 40-character commit SHA to validate (empty selects this workflow revision)"
        required: false
        default: ""
        type: string
      gate:
        description: "Closed qualification profile to run"
        required: true
        default: "full"
        type: choice
        options:
          - quick
          - full
          - build
          - security
          - release

permissions:
  contents: read

jobs:
  validation:
    name: Manual qualification gate
    runs-on: ubuntu-latest
    # gate:release and gate:security are the heaviest selectable profiles, so the
    # budget reflects those rather than gate:quick.
    timeout-minutes: 45
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve exact candidate revision
        id: candidate
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_GATE: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          revision="${REQUESTED_REVISION:-$GITHUB_SHA}"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be an empty value or a full lowercase 40-character Git SHA" >&2
            exit 1
          fi
          case "$REQUESTED_GATE" in
            quick|full|build|security|release) ;;
            *) echo "gate must be one of quick, full, build, security, release" >&2; exit 1 ;;
          esac
          # Full history, never --depth=1: a shallow fetch marks the candidate
          # as a graft boundary, and every qualification report after T68 has
          # to prove `git merge-base --is-ancestor <reported revision> HEAD`.
          # Under a shallow checkout that proof fails for reports that are
          # perfectly valid, so the resolver silently reports an older task and
          # gate:quick can never attest a revision whose tree carries inserted
          # task reports.
          git fetch --no-tags origin "$revision"
          git checkout --detach "$revision"
          if [[ "$(git rev-parse HEAD)" != "$revision" ]]; then
            echo "checked out revision does not match the requested candidate" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "gate=gate:$REQUESTED_GATE" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record candidate identity
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          CANDIDATE_GATE: ${{ steps.candidate.outputs.gate }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { execFileSync } from "node:child_process";

          const revision = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (revision !== process.env.CANDIDATE_REVISION) throw new Error("candidate revision verification failed");
          const ref = process.env.GITHUB_REF ?? "";
          await writeFile(
            "qualification-validation.json",
            `${JSON.stringify({ schemaVersion: 1, revision, ref, gate: process.env.CANDIDATE_GATE }, null, 2)}\n`
          );
          NODE
      # gate:build, gate:security, and gate:release all run test:qualification,
      # which probes the installed Claude Code and Codex binaries. Without them
      # those profiles fail on a clean runner while passing on a machine that
      # happens to have the CLIs, which is the opposite of portable evidence.
      # The need is derived from the candidate revision's own gate definition so
      # this cannot drift from the profile list.
      - name: Decide whether the selected gate needs the driver probes
        id: probes
        env:
          CANDIDATE_GATE: ${{ steps.candidate.outputs.gate }}
        run: |
          set -euo pipefail
          needed="$(node --input-type=module --eval "
            import { GATE_STAGES } from './scripts/gate-stages.mjs';
            const stages = GATE_STAGES[process.env.CANDIDATE_GATE];
            if (stages === undefined) throw new Error('unknown gate profile');
            process.stdout.write(stages.includes('test:qualification') ? 'yes' : 'no');
          ")"
          printf 'needed=%s\n' "$needed" >> "$GITHUB_OUTPUT"
      - name: Install the qualified local driver probes
        if: steps.probes.outputs.needed == 'yes'
        run: |
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.168 @openai/codex@0.115.0
          claude_version="$(claude --version)"
          codex_version="$(codex --version)"
          printf 'Claude Code version: %s\n' "$claude_version"
          printf 'Codex version: %s\n' "$codex_version"
          case "$claude_version" in "2.1.168"|"2.1.168 "*) ;; *) exit 1 ;; esac
          case "$codex_version" in "codex-cli 0.115.0"|"codex-cli 0.115.0 "*) ;; *) exit 1 ;; esac
      - name: Run selected qualification gate
        env:
          CANDIDATE_GATE: ${{ steps.candidate.outputs.gate }}
          # Exact-pin enforcement for the fleet's driver qualification (#18, F4).
          VES_REQUIRE_PINNED_PROVIDERS: "1"
        run: pnpm "$CANDIDATE_GATE"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-validation-${{ github.run_id }}
          path: qualification-validation.json
          retention-days: 14
