name: Manual qualification validation

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact 40-character commit SHA to validate (empty selects this workflow revision)"
        required: false
        default: ""
        type: string
      gate:
        description: "Closed qualification profile to run"
        required: true
        default: "full"
        type: choice
        options:
          - quick
          - full
          - build
          - security
          - release

permissions:
  contents: read

jobs:
  validation:
    name: Manual qualification gate
    runs-on: ubuntu-latest
    # gate:release and gate:security are the heaviest selectable profiles, so the
    # budget reflects those rather than gate:quick.
    timeout-minutes: 45
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve exact candidate revision
        id: candidate
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_GATE: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          revision="${REQUESTED_REVISION:-$GITHUB_SHA}"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be an empty value or a full lowercase 40-character Git SHA" >&2
            exit 1
          fi
          case "$REQUESTED_GATE" in
            quick|full|build|security|release) ;;
            *) echo "gate must be one of quick, full, build, security, release" >&2; exit 1 ;;
          esac
          git fetch --no-tags --depth=1 origin "$revision"
          git checkout --detach "$revision"
          if [[ "$(git rev-parse HEAD)" != "$revision" ]]; then
            echo "checked out revision does not match the requested candidate" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "gate=gate:$REQUESTED_GATE" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record candidate identity
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          CANDIDATE_GATE: ${{ steps.candidate.outputs.gate }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { execFileSync } from "node:child_process";

          const revision = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (revision !== process.env.CANDIDATE_REVISION) throw new Error("candidate revision verification failed");
          const ref = process.env.GITHUB_REF ?? "";
          await writeFile(
            "qualification-validation.json",
            `${JSON.stringify({ schemaVersion: 1, revision, ref, gate: process.env.CANDIDATE_GATE }, null, 2)}\n`
          );
          NODE
      - name: Run selected qualification gate
        env:
          CANDIDATE_GATE: ${{ steps.candidate.outputs.gate }}
        run: pnpm "$CANDIDATE_GATE"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-validation-${{ github.run_id }}
          path: qualification-validation.json
          retention-days: 14
