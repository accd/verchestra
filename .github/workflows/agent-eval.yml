name: Optional real-agent evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: agent-eval-main
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
      - run: corepack enable
      - name: Run deterministic adapter and report optional providers
        run: |
          pnpm agent:eval -- --config tests/agent-eval/profiles/fake.json
          cp .verchestra/.runtime/agent-eval/agent-eval-summary.json .verchestra/.runtime/agent-eval/deterministic-summary.json
          pnpm agent:eval -- --matrix .verchestra/.local/agent-eval
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitized-agent-evaluation-summary
          path: .verchestra/.runtime/agent-eval/*-summary.json
          retention-days: 14
          if-no-files-found: error
