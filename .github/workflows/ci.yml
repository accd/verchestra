name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    # The selection can reach gate:release, whose ten stages include a build
    # and every test suite, so the budget reflects the heaviest selection rather
    # than the lightest.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select the applicable gates
        id: selection
        run: |
          node scripts/select-gates.mjs --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" --json > gate-selection.json
          cat gate-selection.json
          node scripts/gate-output.mjs gate-selection.json "$GITHUB_OUTPUT"
      - name: Install the qualified local driver probes
        if: contains(steps.selection.outputs.stages, 'test:qualification')
        run: |
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.168 @openai/codex@0.115.0
          claude_version="$(claude --version)"
          codex_version="$(codex --version)"
          printf 'Claude Code version: %s\n' "$claude_version"
          printf 'Codex version: %s\n' "$codex_version"
          case "$claude_version" in "2.1.168"|"2.1.168 "*) ;; *) exit 1 ;; esac
          case "$codex_version" in "codex-cli 0.115.0"|"codex-cli 0.115.0 "*) ;; *) exit 1 ;; esac
      - name: Run each selected stage once
        run: |
          set -euo pipefail
          for stage in ${{ steps.selection.outputs.stages }}; do
            echo "::group::pnpm run $stage"
            pnpm run "$stage"
            echo "::endgroup::"
          done
      - name: Upload gate selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-selection-${{ github.sha }}
          path: gate-selection.json
          retention-days: 14

  site:
    name: Site quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Split from the browser download because it is the part that fetches
      # webkit's multimedia dependencies over apt, and a slow Ubuntu mirror used
      # to consume the whole job budget and cancel the run mid-test. A cancelled
      # job reports "Site quality fail", which is indistinguishable from a real
      # regression. Each attempt is bounded so the failure lands here, named, and
      # says which of the two things went wrong.
      - name: Install browser system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 pnpm --filter @verchestra/site exec playwright install-deps; then
              exit 0
            fi
            echo "::warning::Browser system dependencies failed on attempt ${attempt} of 3."
          done
          echo "::error::Could not install browser system dependencies. This is a runner environment failure, not a site qualification failure: no test has run yet."
          exit 1
      - name: Resolve the qualified Playwright version
        id: playwright
        run: |
          version="$(node --print "require('./apps/site/package.json').devDependencies['@playwright/test']")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      # Each Playwright version requires exact browser revisions, so the key
      # carries the resolved version and a stale cache is never restored. A warm
      # cache turns the install below into a verification pass instead of a
      # ~400 MB download on every run.
      - name: Cache qualified browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright.outputs.version }}
      - name: Install qualified browsers
        timeout-minutes: 8
        run: pnpm --filter @verchestra/site exec playwright install chromium firefox webkit
      - name: Run site qualification
        run: pnpm site:test
      - name: Upload verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
