name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    # The selection can reach gate:release, whose ten stages include a build
    # and every test suite, so the budget reflects the heaviest selection rather
    # than the lightest.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select the applicable gates
        id: selection
        run: |
          node scripts/select-gates.mjs --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" --json > gate-selection.json
          cat gate-selection.json
          node scripts/gate-output.mjs gate-selection.json "$GITHUB_OUTPUT"
      - name: Install the qualified local driver probes
        if: contains(steps.selection.outputs.stages, 'test:qualification')
        run: |
          # npm ci installs from the committed lockfile, which pins the sha512 of
          # every package, the platform binaries included (#596). The check
          # refuses a platform package npm skipped: a failed optional package is
          # only a warning to npm. Scripts stay off except Claude Code's
          # postinstall, which links its native binary out of that package. The
          # install lives outside the checkout and reaches later steps on PATH.
          checkout="$PWD"
          providers="$RUNNER_TEMP/qualified-providers"
          mkdir -p "$providers"
          cp .github/qualified-providers/package.json .github/qualified-providers/package-lock.json "$providers"
          cd "$providers"
          npm ci --ignore-scripts --no-audit --no-fund
          node "$checkout/scripts/verify-provider-install.mjs" .
          npm rebuild @anthropic-ai/claude-code
          node -p "require('node:path').join(process.cwd(), 'node_modules', '.bin')" >> "$GITHUB_PATH"
          export PATH="$PWD/node_modules/.bin:$PATH"
          claude_version="$(claude --version)"
          codex_version="$(codex --version)"
          printf 'Claude Code version: %s\n' "$claude_version"
          printf 'Codex version: %s\n' "$codex_version"
          case "$claude_version" in "2.1.282"|"2.1.282 "*) ;; *) exit 1 ;; esac
          case "$codex_version" in "codex-cli 0.115.0"|"codex-cli 0.115.0 "*) ;; *) exit 1 ;; esac
      - name: Run each selected stage once
        # The fleet installs the exact pinned provider CLIs above, so the driver
        # qualification enforces those exact versions here; an independent
        # reviewer without this flag reproduces a green gate against whatever
        # supported build they have installed (#18, F4).
        env:
          VES_REQUIRE_PINNED_PROVIDERS: "1"
        run: |
          set -euo pipefail
          for stage in ${{ steps.selection.outputs.stages }}; do
            echo "::group::pnpm run $stage"
            pnpm run "$stage"
            echo "::endgroup::"
          done
      - name: Upload gate selection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-selection-${{ github.sha }}
          path: gate-selection.json
          retention-days: 14

  site:
    name: Site quality
    # why: pinned, not ubuntu-latest. That label moved to Ubuntu 26.04 on
    # 2026-10-28, whose libicu78 the qualified Playwright WebKit build cannot
    # load (it links libicu74), so every WebKit launch failed. Moving off 24.04
    # waits for a Playwright that supports 26.04, a dependency change of its own.
    runs-on: ubuntu-24.04
    # The bounded steps below compose to roughly 53 minutes worst case: three
    # 5-minute apt attempts, two waits of up to 15 minutes for the apt-get a
    # timed-out attempt leaves behind, and an 8-minute browser install. A
    # budget that does not clear them cancels the job mid-test on a cold cache
    # and a slow mirror - exactly the failure those bounded steps were added to
    # make legible.
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve the qualified Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version="$(node --print "require('./apps/site/package.json').devDependencies['@playwright/test']")"
          # The whole key design rests on that dependency being pinned exactly. If
          # it moves or loosens to a range, node prints "undefined" or "^1.62.0"
          # and still exits 0, so every later run would share one cache entry
          # across versions - the stale-cache case this key exists to prevent.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve an exact @playwright/test version; refusing to cache browsers under an ambiguous key."
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Name the runner image
        id: image
        run: |
          printf 'os=%s\n' "${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # A slow Ubuntu mirror turned the 119 MB the browser dependencies need into
      # a 21-minute install. The archives are kept between runs instead. The key
      # names the runner image, so a new image starts a new entry while
      # restore-keys hand it the last one, and apt downloads only what changed.
      # install-deps runs apt-get as root against /var/cache/apt/archives, which
      # the cache action cannot write, so the cached archives live in the
      # runner's home and are copied in before the install and out after it. apt
      # reuses an archive whose name and checksum match its index.
      - name: Cache the browser dependency apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: ${{ runner.os }}-${{ steps.image.outputs.os }}-apt-archives-${{ steps.playwright.outputs.version }}-${{ steps.image.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.image.outputs.os }}-apt-archives-${{ steps.playwright.outputs.version }}-
            ${{ runner.os }}-${{ steps.image.outputs.os }}-apt-archives-
      - name: Restore the cached apt archives
        run: |
          mkdir -p "$HOME/.cache/apt-archives"
          find "$HOME/.cache/apt-archives" -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
          echo "Restored $(find "$HOME/.cache/apt-archives" -maxdepth 1 -name '*.deb' | wc -l) cached apt archives."
      # Split from the browser download because it is the part that fetches
      # webkit's multimedia dependencies over apt, and a slow Ubuntu mirror used
      # to consume the whole job budget and cancel the run mid-test. A cancelled
      # job reports "Site quality fail", which is indistinguishable from a real
      # regression. Each attempt is bounded so the failure lands here, named, and
      # says which of the two things went wrong.
      # A timed-out attempt ends pnpm, but the apt-get that install-deps started
      # through sudo outlives it and keeps the dpkg lock, so the next attempt
      # used to fail at once on that lock. Each retry therefore first waits, for
      # a bounded time, until no apt-get or dpkg is left running. That apt-get
      # is still installing the same packages, so the wait is long: a 3-minute
      # wait let a mirror that had served 24 of 189 packages in 9 minutes fail
      # all three attempts on the lock. The step prints how long each wait ran.
      - name: Install browser system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 pnpm --filter @verchestra/site exec playwright install-deps; then
              exit 0
            fi
            echo "::warning::Browser system dependencies failed on attempt ${attempt} of 3."
            [ "$attempt" -lt 3 ] || break
            waited=0
            while [ "$waited" -lt 900 ] && { pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null; }; do
              sleep 5
              waited=$((waited + 5))
            done
            echo "Waited ${waited}s for the apt-get and dpkg the last attempt left behind."
          done
          echo "::error::Could not install browser system dependencies. This is a runner environment failure, not a site qualification failure: no test has run yet."
          exit 1
      # why: autoclean drops archives that no current index offers, so the
      # cache holds the versions this image installs and does not grow with
      # every image that inherits it.
      - name: Keep the apt archives for the cache
        run: |
          sudo apt-get autoclean -qq
          rm -f "$HOME"/.cache/apt-archives/*.deb
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/.cache/apt-archives/" {} +
          echo "Kept $(find "$HOME/.cache/apt-archives" -maxdepth 1 -name '*.deb' | wc -l) apt archives."
      # Each Playwright version requires exact browser revisions, so the key
      # carries the resolved version and a stale cache is never restored. A warm
      # cache turns the install below into a verification pass instead of a
      # ~400 MB download on every run.
      - name: Cache qualified browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright.outputs.version }}
      - name: Install qualified browsers
        timeout-minutes: 8
        run: pnpm --filter @verchestra/site exec playwright install chromium firefox webkit
      - name: Run site qualification
        run: pnpm site:test
      # lhci prints only pass/fail, never the numeric score, and no report
      # leaves the runner. Diagnosing issue #110 needs the actual number this
      # run measured, not just whether it cleared the threshold, so this
      # step reads it back out of the report the qualification step already
      # wrote. `if: always()` so a Lighthouse assertion failure still surfaces
      # the score that failed it.
      - name: Report Lighthouse scores
        if: always()
        working-directory: apps/site
        run: |
          for report in .lighthouseci/lhr-*.json; do
            [ -f "$report" ] || continue
            node --print "
              const r = require('./${report}');
              const cats = Object.entries(r.categories).map(([k, v]) => \`\${k}=\${v.score}\`).join(' ');
              const metrics = ['largest-contentful-paint', 'total-blocking-time', 'speed-index', 'cumulative-layout-shift']
                .map((id) => \`\${id}=\${r.audits[id].numericValue}\`).join(' ');
              \`\${cats} | \${metrics}\`;
            "
          done
      # PR #139 review point 3: printing a handful of numbers is not the
      # same as preserving the reports themselves — that gap is exactly why
      # PR #108's 0.92 has no per-metric breakdown to this day (issue #110).
      # `.lighthouseci` holds only lhci's own generated reports (scores,
      # metrics, and page-resource detail for the built site's own public
      # pages against a localhost URL) — no server or process logs, nothing
      # sensitive. `always()` so a failing run still leaves its evidence
      # behind instead of disappearing with the runner.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-${{ github.sha }}
          path: apps/site/.lighthouseci
          # .lighthouseci is itself a dot-prefixed directory; the action's
          # default excludes hidden files AND hidden directories from its
          # glob walk, which silently uploads nothing without this.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Upload verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
