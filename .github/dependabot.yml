version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pi-runtime:
        patterns:
          - "@earendil-works/pi-*"
      opencode-driver:
        patterns:
          - opencode-ai
          - "@opencode-ai/*"
      site-framework:
        patterns:
          - astro
          - "@astrojs/*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: tuf-js
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # why: Pi and OpenCode are qualified driver runtimes. A major moves only as
      # a qualification successor (DSB-05, #563), never as generated; #580 did.
      - dependency-name: "@earendil-works/pi-*"
        update-types:
          - version-update:semver-major
      - dependency-name: opencode-ai
        update-types:
          - version-update:semver-major
      - dependency-name: "@opencode-ai/*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
