version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pi-runtime:
        patterns:
          - "@earendil-works/pi-*"
      opencode-driver:
        patterns:
          - opencode-ai
          - "@opencode-ai/*"
      site-framework:
        patterns:
          - astro
          - "@astrojs/*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: tuf-js
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # why: Pi and OpenCode are qualified driver runtimes. A major moves only as
      # a qualification successor (DSB-05, #563), never as generated; #580 did.
      - dependency-name: "@earendil-works/pi-*"
        update-types:
          - version-update:semver-major
      - dependency-name: opencode-ai
        update-types:
          - version-update:semver-major
      - dependency-name: "@opencode-ai/*"
        update-types:
          - version-update:semver-major
      # why: CedarPolicy pins its engine version exactly, so a minor or a patch
      # fails closed until a qualification successor moves the pin; #583 was
      # merged as generated and turned main red (#589, #563).
      - dependency-name: "@cedar-policy/cedar-wasm"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      # why: json-schema-to-typescript 16 breaks the contract generator (#563).
      - dependency-name: json-schema-to-typescript
        update-types:
          - version-update:semver-major
    # why: a version published minutes ago is not proposed; three days lets a
    # compromised release be withdrawn first. Security updates are not delayed.
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
