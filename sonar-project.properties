# SonarCloud analysis for accd_verchestra, run from .github/workflows/sonarcloud.yml.
# CI-based analysis replaces Automatic Analysis because only CI analysis can
# import the coverage report the test scopes write.
sonar.projectKey=accd_verchestra
sonar.organization=verchestra
sonar.projectName=verchestra

# Product code is a source; test code is a test, so test-only rules (S2187,
# S2699) apply to tests and product rules do not count test helpers as product.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,apps/site/tests/**,spikes/*/test/**,**/*.test.*
sonar.exclusions=\
  tests/**,apps/site/tests/**,spikes/*/test/**,**/*.test.*,\
  **/node_modules/**,**/dist/**,coverage/**,\
  packages/contracts/src/generated.ts

# Coverage is measured for the product packages and CLI only. Scripts, spikes
# and the documentation site are analysed but are not product code under test.
# Each app's closure/ and bin/ hold build inputs and launch stubs the candidate
# builder bundles; they lie outside the sources the test scopes measure (SQC-02),
# so they are not counted.
sonar.coverage.exclusions=scripts/**,spikes/**,apps/site/**,schemas/**,apps/*/closure/**,apps/*/bin/**,eslint.config.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# The owner turned these rules off for the whole project (2026-10-29); the
# plan refuses a custom quality profile, so they are ignored here instead.
# S7503 flags Promise-returning port implementations whose async turns a throw
# into a rejection; S9382 flags loops whose order is the contract. The reasons
# and the sample behind them are in .specs/features/sonarcloud-quality/validation.md.
sonar.issue.ignore.multicriteria=asyncPorts,orderedTs,orderedJs
sonar.issue.ignore.multicriteria.asyncPorts.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.asyncPorts.resourceKey=**/*
sonar.issue.ignore.multicriteria.orderedTs.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.orderedTs.resourceKey=**/*
sonar.issue.ignore.multicriteria.orderedJs.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.orderedJs.resourceKey=**/*
